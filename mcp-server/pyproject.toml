[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "enkstein-mcp"
version         = "0.6.4"
description     = "Enkstein MCP server — governed security tools for AI agents in Cursor, VS Code, and Claude Desktop"
readme          = "README.md"
requires-python = ">=3.11"
license         = "MIT"
keywords        = ["mcp", "security", "zero-trust", "cursor", "vscode", "ai-agents"]
authors         = [{ name = "Enkstein" }]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage      = "https://github.com/wcoreiron-rgb/enkstein"
Documentation = "https://wcoreiron-rgb.github.io/enkstein/"

[project.scripts]
enkstein-mcp = "enkstein_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enkstein_mcp*"]
