[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "enkstein-cli"
version         = "0.5.10"
description     = "Enkstein Zero Trust Ecosystem — Command Line Interface"
readme          = "README.md"
requires-python = ">=3.11"
license         = "MIT"
keywords        = ["security", "zero-trust", "soc", "automation", "cli"]
authors         = [{ name = "Enkstein" }]

dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
]

[project.urls]
Homepage      = "https://github.com/wcoreiron-rgb/enkstein"
Documentation = "https://wcoreiron-rgb.github.io/enkstein/"

[project.scripts]
enkstein = "enkstein.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enkstein*"]
