name: marcellus

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marcellus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marcellus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marcellus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marcellus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marcellus}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-marcellus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marcellus}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      REQUIRE_LIVE_DATA: ${REQUIRE_LIVE_DATA:-false}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-true}
      EMAIL_AUTH_CODE_TTL_SECONDS: ${EMAIL_AUTH_CODE_TTL_SECONDS:-600}
      EMAIL_AUTH_MAX_ATTEMPTS: ${EMAIL_AUTH_MAX_ATTEMPTS:-5}
      EMAIL_AUTH_SMTP_HOST: ${EMAIL_AUTH_SMTP_HOST:-}
      EMAIL_AUTH_SMTP_PORT: ${EMAIL_AUTH_SMTP_PORT:-587}
      EMAIL_AUTH_SMTP_USERNAME: ${EMAIL_AUTH_SMTP_USERNAME:-}
      EMAIL_AUTH_SMTP_PASSWORD: ${EMAIL_AUTH_SMTP_PASSWORD:-}
      EMAIL_AUTH_FROM: ${EMAIL_AUTH_FROM:-}
      BRAIN_BRIDGE_URL: ${BRAIN_BRIDGE_URL:-}
      BRAIN_BRIDGE_SECRET: ${BRAIN_BRIDGE_SECRET:-}
      BRAIN_BRIDGE_TIMEOUT_SECONDS: ${BRAIN_BRIDGE_TIMEOUT_SECONDS:-180}
      DEBUG: "false"
      UVICORN_RELOAD: "false"
      AGT_ENABLE_AGENT_MESH: ${AGT_ENABLE_AGENT_MESH:-false}
      AGT_ENABLE_E2E_MESSAGING: ${AGT_ENABLE_E2E_MESSAGING:-false}
      AGT_ENABLE_MCP_GATEWAY: ${AGT_ENABLE_MCP_GATEWAY:-false}
      AGT_ENABLE_SHADOW_DISCOVERY: ${AGT_ENABLE_SHADOW_DISCOVERY:-false}
      ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}","http://frontend:3000"]'
    volumes:
      - backend_secrets:/app/.secrets
      - backend_state:/app/.state
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_secrets:
  backend_state:
