name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Backend: Unit tests (split shards) ─────────────────────────────────────
  test-backend-core:
    name: Backend Tests Core (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest (core shard)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "true"
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_claw_contracts.py \
            tests/test_claw_task_endpoints.py \
            tests/test_compliance_evidence_export.py \
            tests/test_control_center_summary.py \
            tests/test_customclaw.py \
            tests/test_findings.py \
            tests/test_model_router_hardening.py \
            tests/test_modelclaw.py \
            tests/test_provenance.py \
            tests/test_swarm.py \
            tests/test_swarm_dispatcher_routing.py \
            tests/test_swarm_judge_modelclaw.py \
            tests/test_swarm_parallelism.py \
            tests/test_platform_regressions.py \
            tests/test_terraclaw.py
          do
            echo "::group::${test_file}"
            python scripts/pytest_force_exit.py "${test_file}"
            echo "::endgroup::"
          done

  test-backend-governance:
    name: Backend Tests Governance (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest (governance shard)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "true"
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_channel_gateway_commands.py \
            tests/test_owasp_asi_evidence.py \
            tests/test_policies.py \
            tests/test_policy_harness.py \
            tests/test_remote_control.py \
            tests/test_ring_policy.py \
            tests/test_skill_packs.py \
            tests/test_supply_chain_policy.py \
            tests/test_tenant_isolation.py \
            tests/test_tenant_isolation_scaffold.py \
            tests/test_trust_fabric.py
          do
            echo "::group::${test_file}"
            python scripts/pytest_force_exit.py "${test_file}"
            echo "::endgroup::"
          done

  # ── Backend: Linting ───────────────────────────────────────────────────────
  lint-backend:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/

  # ── Frontend: Build / type check ──────────────────────────────────────────
  test-frontend:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type check included)
        run: npm run build
        env:
          # Prevent Next.js from failing on missing env vars during CI build
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NODE_ENV: production

  # ── Frontend: E2E (Playwright) ────────────────────────────────────────────
  test-frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-frontend]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NODE_ENV: test

  # ── Docker: Verify images build ───────────────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify docker-compose config is valid
        run: docker compose config --quiet

      - name: Build all services
        run: docker compose build --parallel
        env:
          # Dummy values so build-time ARGs don't fail
          DATABASE_URL: "postgresql+asyncpg://regent:regent@db:5432/regentclaw"
          SECRET_KEY: "ci-docker-build-key"

  # ── Supply-chain: SBOM + dependency scan (LLM05 hardening) ───────────────
  supply-chain-security:
    name: Supply Chain Security (SBOM + Dependency Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install audit/SBOM tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit cyclonedx-bom

      - name: Generate Python SBOM (CycloneDX)
        run: |
          mkdir -p security-artifacts
          cyclonedx-py requirements backend/requirements.txt --of JSON -o security-artifacts/sbom-backend.cdx.json

      - name: Generate Frontend lockfile SBOM (CycloneDX)
        run: |
          cd frontend
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-file ../security-artifacts/sbom-frontend.cdx.json --output-format JSON

      - name: Python dependency audit (report)
        run: |
          set +e
          pip-audit -r backend/requirements.txt --format json --output security-artifacts/pip-audit-backend.json
          rc1=$?
          pip-audit -r backend/requirements-test.txt --format json --output security-artifacts/pip-audit-backend-test.json
          rc2=$?
          # pip-audit returns 1 when vulnerabilities are found; preserve report generation.
          if [ "$rc1" -gt 1 ] || [ "$rc2" -gt 1 ]; then
            echo "pip-audit execution error"
            exit 2
          fi
          exit 0

      - name: Frontend dependency audit (report)
        run: |
          set +e
          cd frontend
          npm audit --json > ../security-artifacts/npm-audit-frontend.json
          rc=$?
          # npm audit returns 1 when vulnerabilities are found; preserve report generation.
          if [ "$rc" -gt 1 ]; then
            echo "npm audit execution error"
            exit 2
          fi
          exit 0

      - name: Enforce supply-chain policy thresholds (blocking)
        run: |
          python backend/scripts/enforce_supply_chain_policy.py \
            --pip-report security-artifacts/pip-audit-backend.json \
            --pip-test-report security-artifacts/pip-audit-backend-test.json \
            --npm-report security-artifacts/npm-audit-frontend.json \
            --baseline security/supply_chain_baseline.json \
            --max-critical 0 \
            --max-high 0 \
            --max-moderate 10

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-security-artifacts
          path: security-artifacts/
