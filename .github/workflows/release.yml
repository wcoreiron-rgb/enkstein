name: Build Release Packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  package:
    name: Build downloadable packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package build tooling
        run: python -m pip install --upgrade build

      - name: Verify tag matches package versions
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for manifest in cli/pyproject.toml regentclaw-core/pyproject.toml mcp-server/pyproject.toml; do
            actual=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' "$manifest")
            if [ "$actual" != "$expected" ]; then
              echo "Version mismatch: $manifest is $actual, tag is $expected" >&2
              exit 1
            fi
          done

      - name: Build Python packages
        run: |
          mkdir -p dist
          python -m build --outdir "$GITHUB_WORKSPACE/dist" cli
          python -m build --outdir "$GITHUB_WORKSPACE/dist" regentclaw-core
          python -m build --outdir "$GITHUB_WORKSPACE/dist" mcp-server

      - name: Build self-hosted bundles
        run: ./scripts/build_release_bundle.sh "${GITHUB_REF_NAME}"

      - name: Validate bundle
        run: |
          bundle_dir="dist/regentclaw-${GITHUB_REF_NAME#v}"
          test -x "$bundle_dir/install.sh"
          test -f "$bundle_dir/compose.yaml"
          test -f "$bundle_dir/.env.example"
          "$bundle_dir/install.sh" --check
          rm -rf "$bundle_dir"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "RegentClaw ${GITHUB_REF_NAME}"
          fi
