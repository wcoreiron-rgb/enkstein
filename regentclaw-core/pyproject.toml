[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "regentclaw-core"
version         = "0.5.6"
description     = "Embeddable RegentClaw governance primitives — execution ring policy, provenance verification, and secret/PII scanning. No server required."
readme          = "README.md"
requires-python = ">=3.11"
license         = "MIT"
keywords        = ["security", "zero-trust", "secret-scanning", "policy", "governance"]
authors         = [{ name = "RegentClaw" }]

dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage      = "https://github.com/wcoreiron-rgb/enkstein"
Documentation = "https://wcoreiron-rgb.github.io/enkstein/"

[tool.setuptools.packages.find]
where = ["."]
include = ["regentclaw_core*"]
